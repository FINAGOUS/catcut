name: Build test (cloud)

# First cloud-build check for the FINAGOUS/catcut fork.
# Manual trigger only. Builds the WPF app exactly like the upstream
# release workflow does (setup-tools -> build -> startup checks ->
# portable ZIP), but uploads the ZIP as a workflow artifact instead of
# creating or publishing a GitHub Release. No release is created.
# NOTE: this test build still uses the upstream setup-tools.ps1, which
# downloads Gyan's GPL FFmpeg build. The LGPL FFmpeg swap (M2 plan) is
# a separate step before any public distribution.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download FFmpeg
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          & ./Windows/setup-tools.ps1
          if (-not $?) { throw 'Dependency setup failed.' }

      - name: Build
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File Windows/build.ps1
          if (-not $?) { throw 'Windows build failed.' }

      - name: Startup checks
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--snapshot' -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(30000)) { Stop-Process -Id $app.Id; throw 'Startup check timed out.' }
          if ($app.ExitCode -ne 0 -or -not (Test-Path 'Windows/bin/editor-preview.png')) { throw 'Startup check failed.' }
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--update-test' -WindowStyle Hidden -PassThru -Wait
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/update-results.txt' -Raw).StartsWith('PASS:'))) { throw 'Update checks failed.' }

      - name: W3 feature-panel checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w3-test' -WindowStyle Hidden -PassThru -Wait
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w3-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W3 checks failed.' }

      - name: W4 autosave/cache/camera checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w4-test' -WindowStyle Hidden -PassThru -Wait
          Get-Content 'Windows/bin/w4-results.txt' -Raw
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w4-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W4 checks failed.' }

      - name: W5 panels checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w5-test' -WindowStyle Hidden -PassThru -Wait
          Get-Content 'Windows/bin/w5-results.txt' -Raw
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w5-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W5 checks failed.' }

      - name: W6 panels checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w6-test' -WindowStyle Hidden -PassThru -Wait
          Get-Content 'Windows/bin/w6-results.txt' -Raw
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w6-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W6 checks failed.' }

      - name: W7 panels checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w7-test' -WindowStyle Hidden -PassThru -Wait
          Get-Content 'Windows/bin/w7-results.txt' -Raw
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w7-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W7 checks failed.' }

      - name: Upload W7 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w7-results
          path: Windows/bin/w7-results.txt
          if-no-files-found: warn

      - name: W8 effects checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w8effects-test' -WindowStyle Hidden -PassThru -Wait
          Get-Content 'Windows/bin/w8effects-results.txt' -Raw
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w8effects-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W8 effects checks failed.' }

      - name: Upload W8 effects results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w8effects-results
          path: Windows/bin/w8effects-results.txt
          if-no-files-found: warn

      - name: W8 audio checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w8audio-test' -WindowStyle Hidden -PassThru -Wait
          Get-Content 'Windows/bin/w8audio-results.txt' -Raw
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w8audio-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W8 audio checks failed.' }

      - name: Upload W8 audio results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w8audio-results
          path: Windows/bin/w8audio-results.txt
          if-no-files-found: warn

      - name: W8 timeline checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w8timeline-test' -WindowStyle Hidden -PassThru -Wait
          Get-Content 'Windows/bin/w8timeline-results.txt' -Raw
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w8timeline-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W8 checks failed.' }

      - name: Upload W8 timeline results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w8timeline-results
          path: Windows/bin/w8timeline-results.txt
          if-no-files-found: warn

      - name: W8 colour checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w8colour-test' -WindowStyle Hidden -PassThru -Wait
          Get-Content 'Windows/bin/w8colour-results.txt' -Raw
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w8colour-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W8 colour checks failed.' }

      - name: Upload W8 colour results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w8colour-results
          path: Windows/bin/w8colour-results.txt
          if-no-files-found: warn

      - name: W9 scriptvideo checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w9script-test' -WindowStyle Hidden -PassThru -Wait
          Get-Content 'Windows/bin/w9script-results.txt' -Raw
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w9script-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W9 scriptvideo checks failed.' }

      - name: Upload W9 scriptvideo results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w9script-results
          path: Windows/bin/w9script-results.txt
          if-no-files-found: warn

      - name: W9 sweep checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w9sweep-test' -WindowStyle Hidden -PassThru -Wait
          Get-Content 'Windows/bin/w9sweep-results.txt' -Raw
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w9sweep-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W9 sweep checks failed.' }

      - name: Upload W9 sweep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w9sweep-results
          path: Windows/bin/w9sweep-results.txt
          if-no-files-found: warn

      - name: W9 fixes checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w9fixes-test' -WindowStyle Hidden -PassThru -Wait
          Get-Content 'Windows/bin/w9fixes-results.txt' -Raw
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w9fixes-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W9 fixes checks failed.' }

      - name: Upload W9 fixes results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w9fixes-results
          path: Windows/bin/w9fixes-results.txt
          if-no-files-found: warn

      - name: W9 plugin checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w9plugin-test' -WindowStyle Hidden -PassThru -Wait
          Get-Content 'Windows/bin/w9plugin-results.txt' -Raw
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w9plugin-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W9 plugin checks failed.' }

      - name: Upload W9 plugin results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w9plugin-results
          path: Windows/bin/w9plugin-results.txt
          if-no-files-found: warn

      - name: W9 multitrack checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w9mt-test' -WindowStyle Hidden -PassThru -Wait
          Get-Content 'Windows/bin/w9mt-results.txt' -Raw
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w9mt-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W9 multitrack checks failed.' }

      - name: Upload W9 multitrack results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w9mt-results
          path: Windows/bin/w9mt-results.txt
          if-no-files-found: warn

      - name: W10 import checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w9import-test' -WindowStyle Hidden -PassThru -Wait
          Get-Content 'Windows/bin/w10-import-results.txt' -Raw
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w10-import-results.txt' -Raw).Contains('PASS: W10 import hotfix'))) { throw 'W10 import checks failed.' }

      - name: Upload W10 import results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w10-import-results
          path: Windows/bin/w10-import-results.txt
          if-no-files-found: warn

      - name: W10 transitions checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w10transitions-test' -WindowStyle Hidden -PassThru -Wait
          Get-Content 'Windows/bin/w10transitions-results.txt' -Raw
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w10transitions-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W10 transitions checks failed.' }
      - name: W10 transitions engine checks
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = (Join-Path $PWD 'Windows/tools') + ';' + $env:Path
          # Live engine is product/engine, but in the repo it is only
          # compilable as the merged tree (its ./subtitles, ./presets,
          # ./templates, ... imports live in root engine/src): fill in
          # the missing modules from root engine/src (never overwrite
          # a product file), plus package/tsconfig, for this build only.
          Get-ChildItem engine/src/*.ts | Where-Object { -not (Test-Path (Join-Path 'product/engine/src' $_.Name)) } | ForEach-Object { Copy-Item $_.FullName 'product/engine/src' }
          if (-not (Test-Path 'product/engine/package.json')) { Copy-Item engine/package.json 'product/engine/package.json' }
          if (-not (Test-Path 'product/engine/tsconfig.json')) { Copy-Item engine/tsconfig.json 'product/engine/tsconfig.json' }
          Push-Location product/engine
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Engine deps install failed.' }
          npx tsc -p tsconfig.json
          if ($LASTEXITCODE -ne 0) { throw 'Engine tsc build failed.' }
          Pop-Location
          $env:W10_RESULTS_FILE = Join-Path $PWD 'Windows/bin/w10transitions-results.txt'
          node product/engine/test/verify-transitions.mjs
          if ($LASTEXITCODE -ne 0) { throw 'W10 transitions checks failed.' }
          Get-Content 'Windows/bin/w10transitions-results.txt' -Raw
          if (-not ((Get-Content 'Windows/bin/w10transitions-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W10 transitions checks failed.' }

      - name: Upload W10 transitions results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w10transitions-results
          path: Windows/bin/w10transitions-results.txt
          if-no-files-found: warn

      - name: Package portable ZIP
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File Windows/package.ps1
          if (-not $?) { throw 'Packaging failed.' }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: catcut-windows-portable
          path: Windows/share/*.zip
          if-no-files-found: error
          retention-days: 7
