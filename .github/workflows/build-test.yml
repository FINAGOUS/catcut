          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w4-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W4 checks failed.' }

      - name: W5 panels checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w5-test' -WindowStyle Hidden -PassThru -Wait
