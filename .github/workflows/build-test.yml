name: Build test (cloud)

# First cloud-build check for the FINAGOUS/catcut fork.
# Manual trigger only. Builds the WPF app exactly like the upstream
# release workflow does (setup-tools -> build -> startup checks ->
# portable ZIP), but uploads the ZIP as a workflow artifact instead of
# creating or publishing a GitHub Release. No release is created.
# NOTE: this test build still uses the upstream setup-tools.ps1, which
# downloads Gyan's GPL FFmpeg build. The LGPL FFmpeg swap (M2 plan) is
# a separate step before any public distribution.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download FFmpeg
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          & ./Windows/setup-tools.ps1
          if (-not $?) { throw 'Dependency setup failed.' }

      - name: Build VST3 bridge + AGain
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          # 注意：Start-Transcript 抓不到 native 命令（cmake/git/cl）的输出，
          # 所以每条 native 命令都 *>> 重定向进 native-build.log；失败时把尾巴
          # 打到步骤输出里，完整日志走 w10native-log artifact。
          $log = Join-Path $PWD 'native-build.log'
          function LogStep($m) { Add-Content -Path $log -Value $m }
          function FailStep($m) { LogStep "FAILED: $m"; Get-Content $log -Tail 80; throw $m }
          LogStep 'NATIVE-STEP: versions'
          cmake --version *>> $log
          git --version *>> $log
          LogStep 'NATIVE-STEP: clone SDK'
          git clone --depth 1 --branch v3.8.0_build_66 https://github.com/steinbergmedia/vst3sdk.git vst3sdk *>> $log
          if (-not $?) { FailStep 'VST3 SDK clone failed.' }
          LogStep 'NATIVE-STEP: submodules'
          git -C vst3sdk submodule update --init base cmake pluginterfaces public.sdk vstgui4 *>> $log
          if (-not $?) { FailStep 'VST3 SDK submodule checkout failed.' }
          LogStep 'NATIVE-STEP: configure SDK'
          cmake -S vst3sdk -B vst3sdk-build -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=ON -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_ENABLE_VSTGUI_SUPPORT=ON *>> $log
          if (-not $?) { FailStep 'VST3 SDK configure failed.' }
          LogStep 'NATIVE-STEP: build again + sdk_hosting'
          cmake --build vst3sdk-build --config Release --target again sdk_hosting --parallel 4 *>> $log
          if (-not $?) { FailStep 'AGain / sdk_hosting build failed.' }
          LogStep 'NATIVE-STEP: configure bridge'
          cmake -S Windows/native/vst3 -B vst3bridge-build -DVST3_SDK_ROOT="$PWD/vst3sdk" -DVST3_SDK_BUILD_DIR="$PWD/vst3sdk-build" *>> $log
          if (-not $?) { FailStep 'Bridge configure failed.' }
          LogStep 'NATIVE-STEP: build bridge'
          cmake --build vst3bridge-build --config Release --parallel 4 *>> $log
          if (-not $?) { FailStep 'Bridge build failed.' }
          LogStep 'NATIVE-STEP: copy outputs'
          # 注意：这步跑在 build.ps1 之前，Windows/bin 还不存在；
          # Copy-Item 不会自己建目标目录，先建好再拷。
          # 拷失败要进 native-build.log（裸 throw 只进 job 日志，artifact 里看不到）。
          try {
            New-Item -ItemType Directory -Force 'Windows/bin' | Out-Null
            New-Item -ItemType Directory -Force 'Windows/bin/Plugins' | Out-Null
            Copy-Item vst3bridge-build/bin/Release/Vst3BridgeHost.exe Windows/bin/
            Copy-Item vst3bridge-build/bin/Release/CatCut.Vst3Bridge.dll Windows/bin/
            $again = Get-ChildItem -Path vst3sdk-build -Recurse -Filter 'again.vst3' -Directory | Select-Object -First 1
            if (-not $again) { throw 'again.vst3 bundle not found in SDK build output.' }
            if (-not (Test-Path (Join-Path $again.FullName 'Contents/Resources/moduleinfo.json'))) { throw 'again.vst3 has no moduleinfo.json (moduleinfotool step missing).' }
            Copy-Item -Recurse $again.FullName 'Windows/bin/Plugins/AGain.vst3'
          } catch {
            FailStep "Copy outputs failed: $($_.Exception.Message)"
          }
          LogStep 'NATIVE-STEP: done'

      - name: Upload native build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w10native-log
          path: native-build.log
          if-no-files-found: warn

      - name: Build
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File Windows/build.ps1
          if (-not $?) { throw 'Windows build failed.' }

      - name: Startup checks
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--snapshot' -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(30000)) { Stop-Process -Id $app.Id; throw 'Startup check timed out.' }
          if ($app.ExitCode -ne 0 -or -not (Test-Path 'Windows/bin/editor-preview.png')) { throw 'Startup check failed.' }
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--update-test' -WindowStyle Hidden -PassThru -Wait
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/update-results.txt' -Raw).StartsWith('PASS:'))) { throw 'Update checks failed.' }

      - name: W3 feature-panel checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w3-test' -WindowStyle Hidden -PassThru -Wait
          if ($test.ExitCode -ne 0 -or -not ((Get-Content 'Windows/bin/w3-results.txt' -Raw).StartsWith('PASS:'))) { throw 'W3 checks failed.' }

      - name: W4 autosave/cache/camera checks
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Start-Process -FilePath (Join-Path $PWD 'Windows/bin/CatCut.exe') -ArgumentList '--w4-test' -WindowStyle Hidden -PassThru -Wait
